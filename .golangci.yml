version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # Diagnostics to stdout/stderr: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
