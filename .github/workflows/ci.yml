name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and the four cross-builds run here only: macOS minutes cost 10x.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Later checks run even if an earlier one fails, so a PR sees every failure at once.
      # The make targets are the ones contributors run (Makefile).
      - name: go vet (darwin, linux)
        run: make vet

      - name: golangci-lint (linux)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # The darwin files are build-tagged; lint them here too.
      - name: golangci-lint (darwin)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
        with:
          version: v2.13.2

      - name: go test -race
        if: ${{ !cancelled() }}
        run: make test

      # kill(2)'s EPERM path needs root to start a target and a helper as two other uids; the
      # test skips without it. The binary is built as the runner, so root never writes to the
      # Go cache, and the grep fails the step if the test skipped anyway.
      - name: go test (kill permission, as root)
        if: ${{ !cancelled() }}
        working-directory: internal/engine
        run: |
          go test -c -o "$RUNNER_TEMP/engine.test" .
          sudo "$RUNNER_TEMP/engine.test" -test.run '^TestKillLivePermission$' -test.count=1 -test.v | tee "$RUNNER_TEMP/perm.txt"
          grep -q -- '--- PASS: TestKillLivePermission ' "$RUNNER_TEMP/perm.txt"

      - name: go build (4 targets)
        if: ${{ !cancelled() }}
        run: make cross

      - name: Benchmarks
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: &bench |
          status=0
          go test -run '^$' -bench . -benchtime 20x ./... > bench.txt 2>&1 || status=$?
          cat bench.txt
          printf '### Benchmarks (%s)\n\n```\n%s\n```\n' "$RUNNER_OS" "$(cat bench.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The release pipeline on every push (spec: Testing strategy), so a tag never
  # meets a broken .goreleaser.yaml. Nothing is published in snapshot mode.
  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          # Keep in step with release.yml.
          version: v2.18.2
          args: check

      - name: goreleaser --snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean

      - name: Check archives and cask
        run: |
          set -eu
          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            ls dist/devdash_*_"$target".tar.gz
          done
          (cd dist && sha256sum -c checksums.txt)
          tar -xzf dist/devdash_*_linux_amd64.tar.gz -C "$RUNNER_TEMP" devdash
          out=$("$RUNNER_TEMP/devdash" version)
          echo "$out"
          sha=$(git rev-parse HEAD)
          case "$out" in
            "devdash v"*"-snapshot."*" (commit $sha, built "*")") ;;
            *) echo "unexpected version output"; exit 1 ;;
          esac
          cask=dist/homebrew/Casks/devdash.rb
          cat "$cask"
          test "$(grep -c '^ *url ' "$cask")" -eq 4
          grep -q 'com.apple.quarantine' "$cask"

      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/devdash.rb
          retention-days: 7

  # Phase 3 gate (DEV-53): a compose service's published port shows its container name.
  # Its own job so a Docker hiccup hides no other result. ubuntu-latest has Docker and compose
  # v2; GitHub's macOS runners have no Docker, so macOS is run by hand (docs/gate-phase3.md).
  docker-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: scripts/docker-gate.sh
        run: make docker-gate

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet (darwin, linux)
        run: make vet

      - name: go test -race
        if: ${{ !cancelled() }}
        run: make test

      - name: Benchmarks
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: *bench
