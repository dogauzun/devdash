# Release pipeline (spec: Build, release and distribution).
# CI runs `goreleaser release --snapshot --clean` on every push; a pushed v* tag
# runs the real release from .github/workflows/release.yml.
version: 2

project_name: devdash

# A stale THIRD_PARTY_LICENSES (a dependency bumped without `make licenses`) stops the
# release before anything is built (DEV-98).
before:
  hooks:
    - go run ./scripts/licenses -check

builds:
  - id: devdash
    main: ./cmd/devdash
    binary: devdash
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The version keeps its leading v, as `go install …@v0.1.0` reports it (DEV-64).
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    # Commit time, not build time, so rebuilding a tag gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: devdash
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed owner and mtime so the archive bytes depend only on the commit,
    # not on who builds (DEV-183).
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &info
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *info
      # Notices for the Go standard library and every module linked in (DEV-98).
      - src: THIRD_PARTY_LICENSES
        info: *info
      # The README's links to these resolve inside the unpacked archive (DEV-183).
      - src: docs/usage.md
        info: *info
      - src: docs/limitations.md
        info: *info
      - src: docs/json-schema.md
        info: *info

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^(docs|test|chore|ci|refactor)(\([^)]+\))?!?:'

release:
  github:
    owner: dogauzun
    name: devdash
  # v0.1.0-rc1 and the like are published as prereleases.
  prerelease: auto

# A cask, not a formula: goreleaser deprecated `brews` in v2.16, and casks cover
# Linux too, so `brew install dogauzun/tap/devdash` works on both (DEV-63).
homebrew_casks:
  - name: devdash
    ids: [devdash]
    repository:
      owner: dogauzun
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/dogauzun/devdash
    description: What is running on this machine, grouped by git repository
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "devdash {{ .Tag }}"
    # Prerelease tags do not touch the tap.
    skip_upload: auto
    # The darwin binaries are only ad-hoc signed (spec: Signing), so Gatekeeper
    # would refuse a quarantined download. Homebrew deprecated `postflight`, which
    # is all `hooks` can emit in goreleaser 2.18, so the declarative stanza goes in
    # as a custom block; `{{staged_path}}` is Homebrew's token, escaped from goreleaser's
    # template engine (DEV-104).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/devdash"]
        end
      end
